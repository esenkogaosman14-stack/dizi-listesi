<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dizi & Film Listem</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0f; --surface: #16161a; --surface2: #1e1e24;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.13);
    --text: #f0efe8; --muted: #7c7b84; --accent: #c8f060;
    --accent-dim: rgba(200,240,96,0.12); --red: #ff5f5f;
    --film-accent: #c084fc; --film-dim: rgba(192,132,252,0.12);
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  header { padding: 48px 24px 24px; border-bottom: 0.5px solid var(--border); background: linear-gradient(180deg, #111116 0%, var(--bg) 100%); }
  header h1 { font-family: 'Syne', sans-serif; font-size: clamp(28px, 6vw, 42px); font-weight: 700; letter-spacing: -0.02em; }
  header h1 span { color: var(--accent); }
  header p { margin-top: 8px; font-size: 14px; color: var(--muted); font-weight: 300; }
  .stats { display: flex; gap: 24px; margin-top: 20px; flex-wrap: wrap; align-items: center; }
  .stat { font-size: 13px; color: var(--muted); }
  .stat strong { color: var(--text); font-weight: 500; font-size: 15px; margin-right: 4px; }
  .sync-status { font-size: 12px; padding: 3px 10px; border-radius: 20px; margin-left: auto; }
  .sync-status.ok { background: rgba(200,240,96,0.1); color: var(--accent); }
  .sync-status.syncing { background: rgba(255,255,255,0.05); color: var(--muted); }
  .sync-status.err { background: rgba(255,95,95,0.1); color: var(--red); }
  .header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .header-titles { flex: 1; min-width: 0; }
  .search-wrap { position: relative; flex-shrink: 0; }
  .search-input { background: var(--surface); border: 0.5px solid var(--border2); border-radius: 10px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 13px; padding: 8px 36px 8px 12px; width: 200px; outline: none; transition: border-color 0.2s, width 0.3s, background 0.2s; }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); background: var(--surface2); width: 240px; }
  .search-icon { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 15px; pointer-events: none; line-height: 1; }
  .search-clear { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; padding: 0; display: none; transition: color 0.15s; }
  .search-clear:hover { color: var(--text); }
  main { padding: 24px; max-width: 980px; margin: 0 auto; }
  .controls { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .tabs { display: flex; background: var(--surface); border: 0.5px solid var(--border2); border-radius: 10px; padding: 3px; gap: 2px; }
  .tab-btn { padding: 6px 14px; border-radius: 8px; border: none; background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: background 0.15s, color 0.15s; white-space: nowrap; }
  .tab-btn.active { background: var(--surface2); color: var(--text); }
  .tab-btn.active.series { color: var(--accent); }
  .tab-btn.active.movie { color: var(--film-accent); }
  .sort-btn { padding: 7px 13px; border-radius: 10px; border: 0.5px solid var(--border2); background: var(--surface); color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
  .sort-btn.active { color: #e8b000; border-color: rgba(255,180,0,0.3); background: rgba(255,180,0,0.07); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
  .section-header { font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .section-header.series-header { color: var(--accent); }
  .section-header.movie-header { color: var(--film-accent); }
  .section-count { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 400; text-transform: none; letter-spacing: 0; opacity: 0.7; }
  .list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
  .row { background: var(--surface); border: 0.5px solid var(--border); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; transition: border-color 0.2s; animation: fadeIn 0.25s ease; }
  .row.is-movie { border-left: 2px solid rgba(192,132,252,0.4); }
  .row.is-series { border-left: 2px solid rgba(200,240,96,0.3); }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .row:focus-within { border-color: var(--border2); }
  .row-num { font-family: 'Syne', sans-serif; font-size: 12px; color: var(--muted); text-align: center; font-weight: 600; padding-top: 6px; }
  .row-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; }
  .name-input { background: transparent; border: none; outline: none; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 500; color: var(--text); width: 100%; padding: 4px 0; }
  .name-input::placeholder { color: var(--muted); font-weight: 300; }
  .meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; background: var(--surface2); color: var(--muted); border: 0.5px solid var(--border); white-space: nowrap; }
  .badge.genre { background: var(--accent-dim); color: var(--accent); border-color: rgba(200,240,96,0.2); }
  .badge.genre.movie { background: var(--film-dim); color: var(--film-accent); border-color: rgba(192,132,252,0.2); }
  .badge.imdb { background: rgba(255,180,0,0.1); color: #e8b000; border-color: rgba(255,180,0,0.2); }
  .badge.year { background: rgba(96,184,240,0.1); color: #60b8f0; border-color: rgba(96,184,240,0.2); }
  .spinner { width: 13px; height: 13px; border: 2px solid var(--border2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.6s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1; padding: 4px; border-radius: 8px; opacity: 0.5; transition: opacity 0.15s, color 0.15s; margin-top: 2px; }
  .del-btn:hover { opacity: 1; color: var(--red); }
  .add-btn { width: 100%; padding: 12px; border: 0.5px dashed var(--border2); border-radius: 14px; background: transparent; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s, color 0.15s; margin-bottom: 16px; }
  .add-btn:hover { background: var(--surface); }
  .add-btn.series:hover { color: var(--accent); }
  .add-btn.movie:hover { color: var(--film-accent); }
  .toolbar { display: flex; gap: 8px; justify-content: flex-end; }
  .tool-btn { padding: 9px 16px; border-radius: 10px; border: 0.5px solid var(--border2); background: var(--surface); color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .tool-btn:hover { background: var(--surface2); color: var(--text); }
  .err { font-size: 11px; color: var(--red); }
  .no-results { text-align: center; color: var(--muted); font-size: 14px; padding: 32px 0; display: none; }
  .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #1e1e26; border: 0.5px solid var(--border2); border-radius: 10px; z-index: 100; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.5); margin-top: 4px; }
  .suggestion-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; transition: background 0.1s; border-bottom: 0.5px solid var(--border); }
  .suggestion-item:last-child { border-bottom: none; }
  .suggestion-item:hover { background: var(--surface2); }
  .suggestion-poster { width: 28px; height: 40px; border-radius: 4px; object-fit: cover; background: var(--surface); flex-shrink: 0; }
  .suggestion-poster-placeholder { width: 28px; height: 40px; border-radius: 4px; background: var(--surface2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; }
  .suggestion-info { flex: 1; min-width: 0; }
  .suggestion-title { font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .suggestion-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .suggestion-loading { padding: 12px 14px; font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  @media (max-width: 640px) {
    header { padding: 32px 16px 20px; } main { padding: 16px; }
    .two-col { grid-template-columns: 1fr; }
    .search-input { width: 150px; } .search-input:focus { width: 180px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <div class="header-titles">
      <h1>OFREE<span>Dizi Film Listem</span></h1>
      <p>İzlediğim dizi ve filmlerin sıralı hali</p>
    </div>
    <div class="search-wrap" style="margin-top:6px;">
      <input class="search-input" id="search-input" type="text" placeholder="Listede ara..." oninput="handleSearch(this.value)" autocomplete="off" />
      <span class="search-icon" id="search-icon">&#128269;</span>
      <button class="search-clear" id="search-clear" onclick="clearSearch()" title="Temizle">&#215;</button>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><strong id="total-series">0</strong> dizi</div>
    <div class="stat"><strong id="total-movies">0</strong> film</div>
    <div class="stat"><strong id="avg">&#8212;</strong> ort. puan</div>
    <span class="sync-status syncing" id="sync-status">baglaniyor...</span>
  </div>
</header>
<main>
  <div class="controls">
    <div class="tabs">
      <button class="tab-btn active" id="tab-all" onclick="setTab('all')">Tumü</button>
      <button class="tab-btn series" id="tab-series" onclick="setTab('series')">Diziler</button>
      <button class="tab-btn movie" id="tab-movies" onclick="setTab('movies')">Filmler</button>
    </div>
    <button class="sort-btn" id="sort-btn" onclick="toggleSort()">&#9733; IMDb sirala</button>
  </div>
  <p class="no-results" id="no-results">Sonuc bulunamadi</p>
  <div class="two-col" id="view-all">
    <div>
      <div class="section-header series-header">Diziler <span class="section-count" id="series-count"></span></div>
      <div class="list" id="list-series"></div>
      <button class="add-btn series" onclick="addRow('series')">+ Dizi ekle</button>
    </div>
    <div>
      <div class="section-header movie-header">Filmler <span class="section-count" id="movie-count"></span></div>
      <div class="list" id="list-movies"></div>
      <button class="add-btn movie" onclick="addRow('movies')">+ Film ekle</button>
    </div>
  </div>
  <div id="view-series" style="display:none;">
    <div class="list" id="list-series-only"></div>
    <button class="add-btn series" onclick="addRow('series')">+ Dizi ekle</button>
  </div>
  <div id="view-movies" style="display:none;">
    <div class="list" id="list-movies-only"></div>
    <button class="add-btn movie" onclick="addRow('movies')">+ Film ekle</button>
  </div>
  <div class="toolbar" style="margin-top:8px;">
    <button class="tool-btn" onclick="exportCSV()">&#11015; CSV indir</button>
  </div>
</main>
<script>
const OMDB_KEY = 'f0373d3e';
const FB_URL = 'https://dizi-listesi-default-rtdb.firebaseio.com/diziler';
let rows = [], nextId = 1;
let searchTimers = {};
let activeSuggestions = {};
let sortByImdb = false;
let currentTab = 'all';
let searchQuery = '';

function setSyncStatus(state) {
  const el = document.getElementById('sync-status');
  if (state === 'ok') { el.textContent = 'senkronize'; el.className = 'sync-status ok'; }
  else if (state === 'syncing') { el.textContent = 'kaydediliyor...'; el.className = 'sync-status syncing'; }
  else { el.textContent = 'baglanti hatasi'; el.className = 'sync-status err'; }
}

async function loadFromFirebase() {
  try {
    const res = await fetch(FB_URL + '.json');
    const data = await res.json();
    if (data) {
      rows = Object.values(data).sort((a,b) => a.id - b.id);
      rows.forEach(r => { if (r.id >= nextId) nextId = r.id + 1; if (!r.mediaType) r.mediaType = 'series'; });
    }
    setSyncStatus('ok');
  } catch(e) { setSyncStatus('err'); }
  render();
}

async function saveToFirebase() {
  setSyncStatus('syncing');
  try {
    const obj = {};
    rows.forEach(r => { obj['row_' + r.id] = r; });
    await fetch(FB_URL + '.json', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(obj) });
    setSyncStatus('ok');
  } catch(e) { setSyncStatus('err'); }
}

function addRow(mediaType) {
  if (!mediaType) mediaType = 'series';
  const id = nextId++;
  rows.push({ id, name: '', genre: '', imdb: '', year: '', loading: false, error: false, mediaType });
  render();
  setTimeout(() => { const inp = document.getElementById('inp-' + id); if(inp) inp.focus(); }, 50);
}

function deleteRow(id) {
  rows = rows.filter(r => r.id !== id);
  render();
  saveToFirebase();
}

function getRow(id) { return rows.find(r => r.id === id); }

function getSortedRows(list) {
  if (!sortByImdb) return list;
  return [...list].sort((a, b) => (parseFloat(b.imdb)||0) - (parseFloat(a.imdb)||0));
}

function render() {
  const focused = document.activeElement;
  const focusedId = focused ? focused.id : null;
  const seriesRows = rows.filter(r => r.mediaType === 'series');
  const movieRows  = rows.filter(r => r.mediaType === 'movies');
  renderList('list-series',       getSortedRows(seriesRows));
  renderList('list-movies',       getSortedRows(movieRows));
  renderList('list-series-only',  getSortedRows(seriesRows));
  renderList('list-movies-only',  getSortedRows(movieRows));
  const sc = seriesRows.filter(r=>r.name).length;
  const mc = movieRows.filter(r=>r.name).length;
  document.getElementById('series-count').textContent = sc ? sc + ' adet' : '';
  document.getElementById('movie-count').textContent  = mc ? mc + ' adet' : '';
  if (focusedId) { const el = document.getElementById(focusedId); if (el) { el.focus(); const len = el.value.length; el.setSelectionRange(len,len); } }
  updateStats();
  applySearch();
}

function renderList(listId, items) {
  const list = document.getElementById(listId);
  if (!list) return;
  list.innerHTML = '';
  items.forEach((row, i) => {
    const div = document.createElement('div');
    div.className = 'row ' + (row.mediaType === 'movies' ? 'is-movie' : 'is-series');
    div.innerHTML =
      '<div class="row-num">' + (i+1) + '</div>' +
      '<div class="row-body" id="body-' + row.id + '-' + listId + '">' +
        '<input class="name-input" id="inp-' + row.id + '" value="' + esc(row.name) + '" ' +
          'placeholder="' + (row.mediaType === 'movies' ? 'Film adi girin...' : 'Dizi adi girin...') + '" ' +
          'autocomplete="off" ' +
          'oninput="handleInput(' + row.id + ', this.value)" ' +
          'onblur="handleBlur(' + row.id + ', this.value)" ' +
          'onkeydown="handleKeydown(event, ' + row.id + ')" />' +
        '<div class="meta" id="meta-' + row.id + '-' + listId + '">' + metaHTML(row) + '</div>' +
      '</div>' +
      '<button class="del-btn" onmousedown="event.preventDefault()" onclick="deleteRow(' + row.id + ')" title="Sil">&#215;</button>';
    list.appendChild(div);
    if (activeSuggestions[row.id]) renderSuggestionsInBody('body-' + row.id + '-' + listId, row.id, activeSuggestions[row.id]);
  });
}

function metaHTML(row) {
  if (row.loading) return '<span class="spinner"></span>';
  if (row.error) return '<span class="err">bulunamadi</span>';
  let html = '';
  const isM = row.mediaType === 'movies';
  if (row.genre) html += '<span class="badge genre' + (isM ? ' movie' : '') + '">' + esc(row.genre) + '</span>';
  if (row.imdb)  html += '<span class="badge imdb">&#9733; ' + esc(row.imdb) + '</span>';
  if (row.year)  html += '<span class="badge year">' + esc(row.year) + '</span>';
  return html;
}

function updateStats() {
  document.getElementById('total-series').textContent = rows.filter(r => r.name && r.mediaType === 'series').length;
  document.getElementById('total-movies').textContent = rows.filter(r => r.name && r.mediaType === 'movies').length;
  const scores = rows.filter(r => r.imdb && r.imdb !== 'N/A').map(r => parseFloat(r.imdb)).filter(n => !isNaN(n));
  document.getElementById('avg').textContent = scores.length ? (scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : '—';
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setTab(tab) {
  currentTab = tab;
  document.getElementById('view-all').style.display    = tab === 'all'    ? '' : 'none';
  document.getElementById('view-series').style.display = tab === 'series' ? '' : 'none';
  document.getElementById('view-movies').style.display = tab === 'movies' ? '' : 'none';
  ['all','series','movies'].forEach(t => {
    const btn = document.getElementById('tab-' + t);
    btn.classList.toggle('active', t === tab);
  });
}

function toggleSort() {
  sortByImdb = !sortByImdb;
  document.getElementById('sort-btn').classList.toggle('active', sortByImdb);
  render();
}

function handleSearch(val) {
  searchQuery = val.trim().toLowerCase();
  document.getElementById('search-clear').style.display = searchQuery ? 'block' : 'none';
  document.getElementById('search-icon').style.display  = searchQuery ? 'none'  : 'block';
  applySearch();
}

function clearSearch() {
  searchQuery = '';
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  document.getElementById('search-icon').style.display = 'block';
  applySearch();
}

function applySearch() {
  let visible = 0;
  document.querySelectorAll('.row').forEach(rowEl => {
    const inp = rowEl.querySelector('.name-input');
    const genreEl = rowEl.querySelector('.badge.genre');
    const name = inp ? inp.value.toLowerCase() : '';
    const genre = genreEl ? genreEl.textContent.toLowerCase() : '';
    const match = !searchQuery || name.includes(searchQuery) || genre.includes(searchQuery);
    rowEl.style.display = match ? '' : 'none';
    if (match) visible++;
  });
  document.getElementById('no-results').style.display = (searchQuery && visible === 0) ? 'block' : 'none';
}

function handleInput(id, val) {
  clearTimeout(searchTimers[id]);
  const trimmed = val.trim();
  if (trimmed.length < 2) { delete activeSuggestions[id]; hideSuggestions(id); return; }
  showSuggestionsLoading(id);
  searchTimers[id] = setTimeout(() => fetchSuggestions(id, trimmed), 400);
}

async function fetchSuggestions(id, query) {
  const row = getRow(id);
  const type = (row && row.mediaType === 'movies') ? 'movie' : 'series';
  try {
    const res = await fetch('https://www.omdbapi.com/?s=' + encodeURIComponent(query) + '&type=' + type + '&apikey=' + OMDB_KEY);
    const data = await res.json();
    if (data.Response === 'True' && data.Search) {
      activeSuggestions[id] = data.Search.slice(0, 5);
      ['list-series','list-movies','list-series-only','list-movies-only'].forEach(listId => {
        const bodyId = 'body-' + id + '-' + listId;
        if (document.getElementById(bodyId)) renderSuggestionsInBody(bodyId, id, activeSuggestions[id]);
      });
    } else { delete activeSuggestions[id]; hideSuggestions(id); }
  } catch(e) { hideSuggestions(id); }
}

function showSuggestionsLoading(id) {
  ['list-series','list-movies','list-series-only','list-movies-only'].forEach(listId => {
    const body = document.getElementById('body-' + id + '-' + listId);
    if (!body) return;
    let box = body.querySelector('.suggestions');
    if (!box) { box = document.createElement('div'); box.className = 'suggestions'; body.appendChild(box); }
    box.innerHTML = '<div class="suggestion-loading"><span class="spinner"></span> araniyor...</div>';
  });
}

function renderSuggestionsInBody(bodyId, id, items) {
  const body = document.getElementById(bodyId);
  if (!body) return;
  let box = body.querySelector('.suggestions');
  if (!box) { box = document.createElement('div'); box.className = 'suggestions'; body.appendChild(box); }
  box.innerHTML = '';
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'suggestion-item';
    div.innerHTML =
      (item.Poster && item.Poster !== 'N/A'
        ? '<img class="suggestion-poster" src="' + item.Poster + '" alt="" loading="lazy">'
        : '<div class="suggestion-poster-placeholder">&#127916;</div>') +
      '<div class="suggestion-info">' +
        '<div class="suggestion-title">' + esc(item.Title) + '</div>' +
        '<div class="suggestion-meta">' + (item.Year||'') + ' &middot; ' + (item.Type === 'movie' ? 'Film' : 'Dizi') + '</div>' +
      '</div>';
    div.onmousedown = (e) => { e.preventDefault(); selectSuggestion(id, item); };
    box.appendChild(div);
  });
}

function hideSuggestions(id) {
  ['list-series','list-movies','list-series-only','list-movies-only'].forEach(listId => {
    const body = document.getElementById('body-' + id + '-' + listId);
    if (body) { const s = body.querySelector('.suggestions'); if (s) s.remove(); }
  });
}

async function selectSuggestion(id, item) {
  const row = getRow(id);
  if (!row) return;
  hideSuggestions(id);
  delete activeSuggestions[id];
  document.querySelectorAll('#inp-' + id).forEach(inp => inp.value = item.Title);
  row.name = item.Title;
  row.loading = true; row.genre = ''; row.imdb = ''; row.year = ''; row.error = false;
  updateAllMeta(id, row);
  try {
    const res = await fetch('https://www.omdbapi.com/?i=' + item.imdbID + '&apikey=' + OMDB_KEY);
    const data = await res.json();
    if (data.Response === 'True') {
      row.genre = (data.Genre||'').split(',')[0].trim();
      row.imdb  = data.imdbRating || '';
      row.year  = data.Year || '';
      row.error = false;
    } else { row.error = true; }
  } catch(e) { row.error = true; }
  row.loading = false;
  updateAllMeta(id, row);
  updateStats();
  saveToFirebase();
}

function updateAllMeta(id, row) {
  ['list-series','list-movies','list-series-only','list-movies-only'].forEach(listId => {
    const meta = document.getElementById('meta-' + id + '-' + listId);
    if (meta) meta.innerHTML = metaHTML(row);
  });
}

function handleKeydown(e, id) {
  if (e.key === 'Escape') { hideSuggestions(id); delete activeSuggestions[id]; }
  if (e.key === 'Enter')  { hideSuggestions(id); delete activeSuggestions[id]; e.target.blur(); }
}

function handleBlur(id, val) {
  setTimeout(() => {
    hideSuggestions(id); delete activeSuggestions[id];
    const row = getRow(id);
    if (!row) return;
    const trimmed = val.trim();
    if (!trimmed || trimmed === row.name) return;
    row.name = trimmed;
    fetchDetails(id, trimmed);
  }, 150);
}

async function fetchDetails(id, name) {
  const row = getRow(id);
  if (!row || row.genre) return;
  const type = row.mediaType === 'movies' ? 'movie' : 'series';
  row.loading = true; row.error = false;
  updateAllMeta(id, row);
  try {
    const res = await fetch('https://www.omdbapi.com/?t=' + encodeURIComponent(name) + '&type=' + type + '&apikey=' + OMDB_KEY);
    const data = await res.json();
    if (data.Response === 'True') {
      row.genre = (data.Genre||'').split(',')[0].trim();
      row.imdb  = data.imdbRating || '';
      row.year  = data.Year || '';
      row.error = false;
    } else { row.error = true; }
  } catch(e) { row.error = true; }
  row.loading = false;
  updateAllMeta(id, row);
  updateStats();
  saveToFirebase();
}

function exportCSV() {
  const lines = ['#,Ad,Tur,IMDb,Yil,Tip'];
  rows.filter(r => r.name).forEach((r,i) => {
    lines.push([(i+1), '"'+r.name+'"', '"'+(r.genre||'')+'"', '"'+(r.imdb||'')+'"', '"'+(r.year||'')+'"', '"'+(r.mediaType==='movies'?'Film':'Dizi')+'"'].join(','));
  });
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'listem.csv'; a.click();
}

loadFromFirebase();
